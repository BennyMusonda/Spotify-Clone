<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Page</title>
    <link rel="stylesheet" href="artist.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- NAVIGATION BAR CONTENT-->
    <div class="nav">
        <div class="left-part">
             <div class="logo"><i class="fa-brands fa-spotify"></i> </div>
        </div>

        <div class="center-part">
            <div class="home"><i class="fa-solid fa-house"></i></div>
            <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            <input class="input-box" type="text" placeholder="search for a song..">
            <div class="folder"><i class="fa-solid fa-folder-open"></i></div>
            
        </div>

        <div class="right-part">
            <div class="nav-list">Premium</div>
            <div class="nav-list">Support</div>
            <div class="nav-list">Download</div>
            <div class="install"><i class="fa-regular fa-circle-down"></i>  Install App</div>
            <div class="signup">Sign up</div>
            <button class="login"> Log in</button>
        </div>
    </div>

    <!-- LIBRARY PART-->
     <div class="main">
     <div class="library-section">

     <div class="library-btns">
        <div class="library-title">
            <i class="fa-brands fa-mendeley"></i>
            <div class="library-topic">Library</div>
        </div>

        <div class="createandmax">
        <div class="library-create-btn"><i class="fa-solid fa-plus"></i> Create</div>
        <div class="library-maximise-btn"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></div>
        </div>
        
     </div>

     <div class="library-search-btns">
        <div class="library-search"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="library-recents">recents</div>
     </div>

    
        <div class="liked-songs">
        <img src="imgs/albumcover6.jpg">
        <div class="liked-songs-description">Liked Songs</div> <div class="liked-song-description">
        </div>
    
   
     </div>
     
     <div class="album-1">
        <img src="imgs/albumcover1.jpg">
        <div class="album1-description">Twilight</div>
     </div>

     <div class="album-1">
        <img src="imgs/albumcover2.jpg">
        <div class="album1-description">Daeve</div>
     </div>
     <div class="album-1">
        <img src="imgs/albumcover3.jpg">
        <div class="album1-description">Imole</div>
     </div>
     <div class="album-1">
        <img src="imgs/albumcover4.jpg">
        <div class="album1-description">Blended</div>
     </div>

     </div>

    <!-- ARTIST PART-->
     <div class="artist-section">
        <img src="imgs/landscape-album-cover.png">
        <div class="artist-img-part">
            <div class="artist-title"> SZA SA</div>
            <div class="artist-description"><i class="fa-solid fa-certificate"></i> Verified Artist</div>
            <div class="artist-subdescription"> 2, 000, 000 Monthly Streams</div>
        </div>
        
        <div class="music-section">
        <div class="player-display"> 
            <div class="play-button"><i class="fa-solid fa-circle-play"></i></div>
            <div class="shuffle-button"><i class="fa-solid fa-shuffle"></i></div>
            <button class="following-button">Following</button>
            <div class="option-button"><i class="fa-solid fa-ellipsis"></i></div>
        </div>
        <div class="popular-section">
            <h4>Popular</h4>
            <div class="popluar-tracks">
                <div class="track01">
                    <img src="imgs/album-cover1.jpg">
                    <div class="track01-description">Yo maps</div>
                </div>
                  <div class="track01">
                    <img src="imgs/album-cover2.jpg">
                    <div class="track01-description">Daev</div>
                </div>
                  <div class="track01">
                    <img src="imgs/album-cover3.jpg">
                    <div class="track01-description">Kambenja </div>
                </div>
                  <div class="track01">
                    <img src="imgs/album-cover4.jpg">
                    <div class="track01-description">Alex J.</div>
                </div>
                  <div class="track01">
                    <img src="imgs/album-cover5.jpg">
                    <div class="track01-description">Red Ling</div>
                </div>
                  <div class="track01">
                    <img src="imgs/album-cover6.jpg">
                    <div class="track01-description">John Wick</div>
                </div>
                  <div class="track01">
                    <img src="imgs/album-cover7.jpg">
                    <div class="track01-description">Chile One</div>
                </div>
                  <div class="track01">
                    <img src="imgs/album-cover8.jpg">
                    <div class="track01-description">Mark Boston</div>
                </div>
                
                
            </div>
        </div>
     </div>

    </div>
    </div>
    </div>

    <!-- MEDIA PLAYER PART-->
    <div class="media-player-section">
        <div class="artist-art">

            <div class="artwork">
                <img src="imgs/albumcover4.jpg">
                <div class="artwork-info">
                    <div class="artwork-title"> Chelsea Mwape</div>
                <div class="artwork-description">I Love You</div>
                </div> 
            </div>

            <div class="controls">
                <div class="music-buttons">
                    <div class="shuffle-btn"><i class="fa-solid fa-shuffle"></i></div>
                    <div class="previous-btn"><i class="fa-solid fa-backward-step"></i></div>
                    <div class="play-btn"><i class="fa-solid fa-circle-play"></i></div>
                    <div class="next-btn"><i class="fa-solid fa-forward-step"></i></div>
                    <div class="loop-btn"><i class="fa-solid fa-repeat"></i></div>
                </div>
                <div class="progress-bar">
                    <input class="progress" type="range">
                </div>
            </div>

            <div class="media-controls">volume</div>

        </div>
    



    <script src="artist.js"></script>
</body>
</html>
